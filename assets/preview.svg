<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-labelledby="t d">
  <title id="t">Graveyard and Ash color preview</title>
  <desc id="d">Illustrated color preview of the theme: a near-black green dark mode beside a soft ash gray light mode.</desc>
  <style>
    text { font-family: Georgia, 'Times New Roman', serif; }
    .h { font-size: 30px; font-weight: 700; }
    .s { font-size: 17px; }
    .c { font-family: Consolas, Menlo, monospace; font-size: 15px; }
  </style>

  <rect width="480" height="400" fill="#0e140f"/>
  <rect x="32" y="112" width="416" height="150" rx="12" fill="#1b251c"/>
  <text x="32" y="58" class="h" fill="#e6f0d8">Graveyard</text>
  <text x="32" y="88" class="s" fill="#c0cfb2">Dark mode: toxic green on near-black</text>
  <text x="54" y="150" class="c" fill="#408e00">const</text>
  <text x="108" y="150" class="c" fill="#e6f0d8">horde = rise(</text>
  <text x="226" y="150" class="c" fill="#f6b422">'midnight'</text>
  <text x="312" y="150" class="c" fill="#e6f0d8">)</text>
  <text x="54" y="184" class="c" fill="#9aab8c">// the dead keep shipping</text>
  <text x="54" y="218" class="c" fill="#268e50">+ survivors found</text>
  <text x="54" y="244" class="c" fill="#d03a42">- brains remaining</text>
  <g>
    <circle cx="52" cy="326" r="20" fill="#408e00"/>
    <circle cx="106" cy="326" r="20" fill="#d03a42"/>
    <circle cx="160" cy="326" r="20" fill="#268e50"/>
    <circle cx="214" cy="326" r="20" fill="#f6b422"/>
    <circle cx="268" cy="326" r="20" fill="#8f54d5"/>
  </g>

  <rect x="480" width="480" height="400" fill="#d8dacf"/>
  <rect x="512" y="112" width="416" height="150" rx="12" fill="#e4e6db"/>
  <text x="512" y="58" class="h" fill="#060704">Ash</text>
  <text x="512" y="88" class="s" fill="#0e100a">Light mode: soft gray with low glare</text>
  <text x="534" y="150" class="c" fill="#5c2da7">const</text>
  <text x="588" y="150" class="c" fill="#060704">horde = rise(</text>
  <text x="706" y="150" class="c" fill="#7b3e02">'daybreak'</text>
  <text x="792" y="150" class="c" fill="#060704">)</text>
  <text x="534" y="184" class="c" fill="#1a1c14">// easy on the eyes</text>
  <text x="534" y="218" class="c" fill="#3c5b15">+ survivors found</text>
  <text x="534" y="244" class="c" fill="#95181d">- brains remaining</text>
  <g>
    <circle cx="532" cy="326" r="20" fill="#5c2da7"/>
    <circle cx="586" cy="326" r="20" fill="#95181d"/>
    <circle cx="640" cy="326" r="20" fill="#3c5b15"/>
    <circle cx="694" cy="326" r="20" fill="#7b3e02"/>
    <circle cx="748" cy="326" r="20" fill="#8a2d06"/>
  </g>
</svg>
